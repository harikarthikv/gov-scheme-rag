[project]
name = "gov-scheme-rag"
version = "0.1.0"
description = "Evidence-grounded Indian government scheme assistant with hybrid retrieval and reproducible RAG evaluation"
readme = "README.md"
authors = [
    { name = "harikarthikv", email = "harikarthikvairavelu@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "chromadb>=1.5,<2",
    "langchain-chroma>=1.1,<2",
    "langchain-core>=1,<2",
    "langchain-huggingface>=1,<2",
    "langchain-openai>=1,<2",
    "langchain-text-splitters>=1,<2",
    "pymupdf>=1.24.0",
    "python-dotenv>=1.0.0",
    "sentence-transformers>=6,<7",
    "streamlit>=1.61.0",
]

[build-system]
requires = ["uv_build>=0.12.1,<0.13.0"]
build-backend = "uv_build"
